[pytest]
# Discovery is rooted here so cases/ and conftest.py are picked up
# regardless of where pytest is invoked from.
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    slow: sweeps the whole corpus; a couple of minutes each. Deselect with
        `-m "not slow"` for a working run -- but these are in the default set
        on purpose, because a diagnostic nobody runs is one nobody trusts.
