name: tensorforge
on:
  - push

jobs:
  tests:
    # Everything that needs neither a GPU nor a vendor toolchain: snapshots,
    # the host syntax check, the IR and pass tests, the tools.  The GPU cases
    # skip themselves when no target is found.
    name: ${{matrix.system.platform}}-tests (python ${{ matrix.python }})
    runs-on: ${{matrix.system.runner}}
    container: ${{matrix.system.container}}
    strategy:
      fail-fast: false
      matrix:
        # The floor `requires-python` states, and a current release.
        python: ['3.10', '3.13']
        system:
          - platform: host
            runner: ubuntu-24.04
            container: ~
          - platform: sm_86
            runner: gpu-nv
            container: { image: "seissol/gha-gpu-nv:davschneller-gpu-image", options: "--runtime=nvidia --gpus=all"}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: install
        run: python -m pip install -e '.[test]'

      - name: test
        working-directory: tests
        run: python -m pytest -q -ra -n auto
