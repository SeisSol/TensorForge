[project]
name = "tensorforge"
description = "Code generator for small batched tensor contraction kernels on GPUs"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "David Schneller", email = "david.schneller@tum.de" },
    { name = "Ravil Dorozhinskii", email = "ravil.aviva.com@gmail.com" },
    { name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" },
    { name = "Elias Reutelsterz", email = "elias.reutelsterz@tum.de" }
]
maintainers = [
    { name = "David Schneller", email = "david.schneller@tum.de" }
]
classifiers= [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version", "readme", "dependencies"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
version = {file = ["src/tensorforge/VERSION"]}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
"*" = ["*.*", "VERSION"]
