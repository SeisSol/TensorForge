# A recorded kernel description is data written by `dump_descriptors.py`, and
# what yateto handed gemmforge and chainforge is a recording too (`forge/`),
# so neither carries a header of its own; there is nowhere in JSON to put one.  A
# clustering is a table in SeisSol's own format, which has no comment line.
[[annotations]]
path = ["tests/fixtures/kernels/**", "tests/fixtures/seissol/**", "tests/fixtures/forge/**", "tools/bench/data/**", "tools/bench/clusterings/**"]
