# NVIDIA
- arch: sm_60
  # Instruction cache a resident batch loop has to fit: the L1 instruction
  # cache per SM, 128 KB on Volta by microbenchmark (Jia et al., 2018), with a
  # 12-16 KB L0 per sub-partition in front of it.  Assumed for the other
  # generations until measured.
  icache_size: 128kB
  # Bytes of parameters a kernel may take: 4 kB up to CUDA 12.0, 32764 from
  # CUDA 12.1 on Volta and later.  Stated as the larger figure only where the
  # architecture already needs a toolchain that new.
  max_argument_size: 4kB
  vec_unit_length: 32
  max_local_mem_size_per_block: 48kB
  max_num_threads: 1024
  max_reg_per_block: 64kB
  max_threads_per_sm: 2048
  max_block_per_sm: 32
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 32
  # 255 registers of 4 bytes per thread, what ptxas will allocate at most.
  # The spill filter compares `pir.pressure` against this.
  max_reg_per_thread: 1020B
  name: 'nvidia'
- arch: sm_61
  base: sm_60
- arch: sm_62
  base: sm_60
- arch: sm_70
  base: sm_60
  max_local_mem_size_per_block: 96kB
- arch: sm_71
  base: sm_60
- arch: sm_75
  base: sm_60
  max_local_mem_size_per_block: 64kB
  max_block_per_sm: 16
- arch: sm_80
  base: sm_60
  max_local_mem_size_per_block: 163kB
- arch: sm_86
  base: sm_60
  max_local_mem_size_per_block: 99kB
  max_block_per_sm: 16
  max_threads_per_sm: 1536
- arch: sm_87
  max_local_mem_size_per_block: 163kB
  base: sm_60
- arch: sm_89
  max_local_mem_size_per_block: 99kB
  base: sm_60
- arch: sm_90
  base: sm_60
  max_local_mem_size_per_block: 227kB # shared with L1; together 256 kiB
- arch: sm_100
  base: sm_90
  max_argument_size: 32764B
- arch: sm_101
  base: sm_90
  max_argument_size: 32764B
- arch: sm_110
  base: sm_90
  max_argument_size: 32764B
- arch: sm_120
  base: sm_89
  max_argument_size: 32764B

# AMD
- arch: gfx900
  # Instruction cache shared by up to four compute units (GCN).
  icache_size: 32kB
  # The HIP runtime's classic limit on a kernel's arguments.  Only operands
  # passed by value count against it: a batch-constant one in memory is
  # read through the constant space, which reaches device memory.
  max_argument_size: 4kB
  # 256 VGPRs of 4 bytes per lane: `getAddressableNumArchVGPRs` in LLVM's
  # AMDGPUBaseInfo.cpp.  gfx908 inherits it -- its AGPRs are a separate file
  # the compiler spills into, not addressable VGPRs.
  max_reg_per_thread: 1kB
  # 102 SGPRs of 4 bytes per *wave*, not per lane: `getAddressableNumSGPRs`
  # for GFX9.  A value the whole wave agrees on lives here and is computed by
  # the scalar unit, a pipe of its own -- which is why the register model
  # counts it apart (`Context.peak_uniform_pressure`).  SeisSol's damage step
  # fills this file on gfx1150 and spills 117 of them.
  max_scalar_reg_per_wave: 408B
  vec_unit_length: 64
  max_local_mem_size_per_block: 64kB
  max_num_threads: 1024
  max_reg_per_block: 256kB
  max_threads_per_sm: 2560
  max_block_per_sm: 40
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 32
  name: 'amd'
- arch: gfx906
  base: gfx900
- arch: gfx908
  base: gfx900
  max_reg_per_block: 512kB
- arch: gfx90a
  base: gfx908
  # CDNA 2 and 3: 64 KB of instruction cache shared by two compute units.
  icache_size: 64kB
  # `FeatureGFX90AInsts`: one unified file of 512 VGPRs and AGPRs per lane
  # (`getAddressableNumVGPRs`), inherited by gfx940 to gfx950.
  max_reg_per_thread: 2kB
- arch: gfx940
  base: gfx90a
- arch: gfx941
  base: gfx90a
- arch: gfx942
  base: gfx90a
- arch: gfx950
  base: gfx90a
  max_local_mem_size_per_block: 160kB
- arch: gfx1010
  # RDNA: 32 KB of instruction cache per work-group processor (two compute
  # units).  Assumed for RDNA 4 and gfx125x until measured.
  icache_size: 32kB
  # The HIP runtime's classic limit on a kernel's arguments.  Only operands
  # passed by value count against it: a batch-constant one in memory is
  # read through the constant space, which reaches device memory.
  max_argument_size: 4kB
  # 256 VGPRs per lane in wave32 and wave64 alike, through gfx12.
  max_reg_per_thread: 1kB
  # 106 SGPRs of 4 bytes per wave from GFX10 on (`getAddressableNumSGPRs`).
  max_scalar_reg_per_wave: 424B
  vec_unit_length: 32
  # What one work-group may allocate, not what a WGP holds: 128 kB per WGP,
  # 64 kB per work-group.  gfx1150 reports 65536 for MaxSharedMemoryPerBlock
  # and for the opt-in, and `hipFuncSetAttribute` refuses more -- which a
  # preloaded prologue of 101 kB (local_flux, TF32-split operators) asked for.
  max_local_mem_size_per_block: 64kB
  max_num_threads: 1024
  max_reg_per_block: 256kB
  max_threads_per_sm: 1280
  max_block_per_sm: 40
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 64
  name: 'amd'
- arch: gfx1030
  base: gfx1010
- arch: gfx1100
  base: gfx1010
- arch: gfx1101
  base: gfx1010
- arch: gfx1102
  base: gfx1010
- arch: gfx1103
  base: gfx1010
- arch: gfx1150
  base: gfx1010
- arch: gfx1200
  base: gfx1010
- arch: gfx1201
  base: gfx1010
- arch: gfx1250
  base: gfx1010
  # `Feature1024AddressableVGPRs` addresses 1024 in wave32, but
  # `getMaxNumVGPRs` divides the file by the waves per EU the work-group size
  # implies, and at the block sizes this generator launches hipcc allocated
  # 512 and spilled beyond it (local_flux, 16 lanes).  The budget is what a
  # kernel here can actually have, inherited by gfx1251.
  max_reg_per_thread: 2kB
  max_local_mem_size_per_block: 384kB # WGP(?) mode. With L1 together: 448 kiB
- arch: gfx1251
  base: gfx1250

# Intel
- arch: pvc
  # What Intel GPUs report as their kernel parameter size.
  max_argument_size: 2kB
  # Xe-HPC: 128 general registers of 64 bytes per thread, or 256 with the
  # large-GRF mode ([[intel::grf_size(256)]]).  The smaller one is the default
  # and the honest budget -- a kernel that only fits in large GRF halves the
  # threads in flight, which is a decision and not a fallback.
  max_reg_per_thread: 8kB
  vec_unit_length: 16
  max_local_mem_size_per_block: 128kB
  max_num_threads: 512
  max_reg_per_block: 64kB
  max_threads_per_sm: 1024
  max_block_per_sm: 64
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 32
  name: 'intel'
- arch: dg1
  # What Intel GPUs report as their kernel parameter size.
  max_argument_size: 2kB
  vec_unit_length: 64
  max_local_mem_size_per_block: 64kB
  max_num_threads: 512
  max_reg_per_block: 64kB
  max_threads_per_sm: 512
  max_block_per_sm: 64
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 32
  name: 'intel'
- arch: bdw
  # What Intel GPUs report as their kernel parameter size.
  max_argument_size: 2kB
  vec_unit_length: 32
  max_local_mem_size_per_block: 48kB
  max_num_threads: 256
  max_reg_per_block: 64kB
  max_threads_per_sm: 256
  max_block_per_sm: 32
  hw_fp_word_size: 4
  mem_access_align_size: 32
  shmem_banks: 32
  name: 'intel'
- arch: skl
  base: bdw
- arch: Gen8
  base: bdw
- arch: Gen9
